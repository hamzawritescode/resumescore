services:
  - type: web
    name: resumescore
    runtime: node
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: resumescore-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        value: https://resumescore.onrender.com

databases:
  - name: resumescore-db
    databaseName: resumescore
    user: resumescore
    plan: free
